# Asphalt 7: Heat (Microsoft Store package GAMELOFTSA.Asphalt7HeatByGameloft). Sourced by run-app.sh as shell.
# The game's C++ tasks (PPL) need the Concurrency Runtime that Microsoft's msvcr110.dll and msvcp110.dll (from the
# Microsoft.VCLibs.110 framework, linked into the app's folder) have, and Wine's builtin ones, which Wine prefers over
# an older native DLL otherwise, don't ("unimplemented function ..._CancellationTokenState..._NewTokenState").
export WINEDLLOVERRIDES="${WINEDLLOVERRIDES};msvcr110,msvcp110=n,b"

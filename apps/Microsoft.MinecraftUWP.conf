# Minecraft for Windows: without an Xbox Live connection it names the player from options.txt's mp_username, which
# is empty at first, so everyone on a LAN game is "Player". Fill it in with WINE_UWP_GAMERTAG, or the Linux user name,
# unless a name is already there (one set by hand is kept).
mc_options="$PREFIX/drive_c/users/$USER/AppData/Local/Packages/Microsoft.MinecraftUWP_8wekyb3d8bbwe/LocalState/games/com.mojang/minecraftpe/options.txt"
mc_name="${WINE_UWP_GAMERTAG:-$USER}"
mc_name="${mc_name//[^A-Za-z0-9 _-]/}"
if [ -n "$mc_name" ] && [ -f "$mc_options" ] && grep -q '^mp_username:\s*$' "$mc_options"; then
    sed -i "s/^mp_username:\s*\$/mp_username:$mc_name/" "$mc_options"
fi
unset mc_options mc_name

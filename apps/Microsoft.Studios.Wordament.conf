# Microsoft Ultimate Word Games (Wordament): with an internet connection reported, it tries to sync its progress with
# Xbox cloud storage and asks about each failure ("Your game progress could not be saved"), again at every save.
# Report no internet connection so it plays offline; WINE_UWP_OFFLINE= (empty) reports the host's connection again.
export WINE_UWP_OFFLINE="${WINE_UWP_OFFLINE-1}"
